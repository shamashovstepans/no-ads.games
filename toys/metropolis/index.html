<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Metropolis: call the settlers</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Onest:wght@500;700&display=swap">
<style>
:root { --ink: #15303a; --card: #fffdf7; --fun: "Bagel Fat One", "Arial Rounded MT Bold", system-ui, sans-serif; --text: Onest, system-ui, -apple-system, "Segoe UI", sans-serif; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: #cfe5ec; color: var(--ink); font: 700 16px/1.4 var(--text); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: #0000; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; transform-origin: 0 0; transition: transform 0.6s; }
button { font: inherit; font-size: 17px; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid; outline-offset: 2px; }
[hidden] { display: none !important; }
.hud { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; }
.hud p { margin: 0; font: 34px/1 var(--fun); white-space: nowrap; }
#unit { margin-left: 6px; font: 700 17px var(--text); }
.bar { width: 128px; height: 6px; margin: 9px auto 0; overflow: hidden; background: #15303a24; border-radius: 3px; }
#bar { display: block; height: 100%; background: var(--ink); transform: scaleX(0); transform-origin: left; transition: transform 0.2s; }
#mute { position: fixed; top: max(8px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right)); display: grid; place-items: center; width: 44px; height: 44px; padding: 0; background: #ffffff8c; border: 0; border-radius: 50%; }
svg { width: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
path:first-child { fill: currentColor; }
.off, [aria-pressed="false"] .on { display: none; }
[aria-pressed="false"] .off { display: inline; }
#hint { position: fixed; left: 50%; bottom: max(26px, calc(env(safe-area-inset-bottom) + 14px)); display: flex; align-items: center; gap: 10px; margin: 0; padding: 11px 18px 11px 14px; white-space: nowrap; background: var(--card); border-radius: 99px; box-shadow: 0 8px 22px -10px #15303a8c; transform: translateX(-50%); pointer-events: none; transition: opacity 0.3s; }
#hint i { width: 14px; height: 14px; background: #e2553a; border-radius: 50%; animation: ping 1.2s infinite alternate; }
@keyframes ping { to { transform: scale(0.6); } }
#hint.gone { opacity: 0; }
/* End card: a sheet below the village, or a panel beside it on wide frames */
#end { position: fixed; inset: auto 0 0; display: flex; justify-content: center; padding: 16px 16px max(16px, env(safe-area-inset-bottom)); pointer-events: none; animation: rise 0.45s ease-out both; }
@keyframes rise { from { opacity: 0; transform: translateY(24px); } }
#card { box-sizing: border-box; width: 100%; max-width: 360px; max-height: calc(100vh - 32px); overflow: auto; padding: 24px 22px 20px; text-align: center; background: var(--card); border-radius: 26px; box-shadow: 0 22px 50px -22px #15303a99; pointer-events: auto; }
h1 { margin: 0; font: 30px/1.05 var(--fun); text-wrap: balance; }
#card p { margin: 10px 0 0; font-weight: 500; color: #3b5761; }
#card #meta { font-size: 15px; font-weight: 700; color: var(--ink); }
#card div { display: grid; gap: 10px; margin-top: 18px; }
#card button, #card #thanks { min-height: 50px; margin: 0; border: 2px solid; border-radius: 99px; background: none; }
#card #like { color: #fff; background: var(--ink); border-color: var(--ink); }
#card #thanks { display: grid; place-items: center; font-weight: 700; color: var(--ink); background: #e2f1d3; border-color: #0000; }
@media (min-aspect-ratio: 29/20) {
  .hud { left: max(70px, env(safe-area-inset-left)); transform: none; text-align: left; } /* clear of the player's close button */
  .bar { margin-left: 0; }
  #end { inset: 0 0 0 auto; align-items: center; padding: 16px max(16px, env(safe-area-inset-right)) 16px 0; }
  #card { width: 330px; }
}
@media (prefers-reduced-motion: reduce) {
  #hint i, #end { animation: none; }
  canvas, #bar { transition: none; }
}
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="An island village. Hold anywhere to call settlers."></canvas>
<div class="hud">
  <p><b id="n">0</b><span id="unit">people</span></p>
  <div class="bar"><i id="bar"></i></div>
</div>
<button id="mute" type="button" aria-label="Sound on" aria-pressed="true">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.2L12 5.6v12.8l-4.8-3.9H4z"/><path class="on" d="M15.6 9.3a4 4 0 0 1 0 5.4M18.3 6.7a7.6 7.6 0 0 1 0 10.6"/><path class="off" d="M16 9.5l5 5m0-5-5 5"/></svg>
</button>
<p id="hint"><i></i>Hold anywhere to call settlers</p>
<div id="end" hidden>
  <div id="card" role="dialog" aria-labelledby="title">
    <h1 id="title">Your village has 300 people</h1>
    <p>Pocket Metropolis grows it into a city of 10 million. Coming soon to iPhone.</p>
    <p id="meta"></p>
    <div>
      <button id="like" type="button">I want this game</button>
      <p id="thanks" role="status" hidden>Thanks! We'll count you in.</p>
      <button id="again" type="button">Play again</button>
    </div>
  </div>
</div>
<script type="module">
const { PI, cos, sin, hypot, min, max, abs, round, floor, random } = Math;
const TAU = PI * 2, GOAL = 300, BEST_KEY = "nag.toy.metropolis.best", SOUND_KEY = "nag.sound";
// World units: island radius R, square SQ, roads of half width RW. A gentle 3/4 view: ground squashed by T, heights by HZ, turned by YAW
const R = 80, SQ = 17, SQ_IN = SQ * cos(PI / 8), RW = 3.6, RIM = 11, T = 0.8, HZ = 0.6, YAW = 0.35, COS = cos(YAW), SIN = sin(YAW);
const LIGHT = [-0.55, 0.3, 0.78], SW = [0.56 * COS - 0.31 * SIN, -0.56 * SIN - 0.31 * COS]; // light (view), shadow drift per unit of height (world)
const WALLS = ["#f7f0e1", "#fbf8f1", "#f3e2c0", "#f2dccf", "#e5e9ea"], ROOFS = ["#d9533b", "#e8823a", "#9c5a3c", "#5d6c80", "#c8643a", "#e0663f"];
const CLOTHES = ["#e5533d", "#3f7fd9", "#f2c230", "#47a35a", "#8e5bc9", "#fbfbf6", "#f08b37", "#2fb3a7", "#ee7fb0", "#3a4a5e"];
const SKINS = ["#f6d3b3", "#e3ae86", "#b57a54", "#7d5236"], HAIR = ["#3b2a20", "#6b4a2b", "#d9a654", "#26221f"];
const TREES = [["#62b34b", 3, 7.8], ["#4fa046", 2.6, 6.8], ["#79c45a", 3.3, 8.3], ["#3f8f4f", 2.4, 7], ["#f1b3c6", 2.8, 7.2], ["#ef8a45", 2.7, 7.2]]; // colour, radius, height

const $ = (id) => document.getElementById(id);
const load = (k) => { try { return localStorage.getItem(k); } catch {} };
const save = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
let seed = 11;
const srand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const rand = (a, b) => a + random() * (b - a), pick = (a) => a[floor(random() * a.length)], clamp = (v, a, b) => min(b, max(a, v));
const vx = (x, y) => x * COS - y * SIN, vy = (x, y) => x * SIN + y * COS;
const motion = matchMedia("(prefers-reduced-motion: reduce)"), calm = () => motion.matches;
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16), c = (v) => min(255, round(v * f));
  return `rgb(${c(n >> 16)},${c((n >> 8) & 255)},${c(n & 255)})`;
}
const lit = (hex, n) => shade(hex, clamp(0.7 + 0.32 * (n[0] * LIGHT[0] + n[1] * LIGHT[1] + n[2] * LIGHT[2]), 0.56, 1.06));
const rect = (x, y, a, hl, hw) => [[-hl, -hw], [hl, -hw], [hl, hw], [-hl, hw]].map(([u, v]) => [x + u * cos(a) - v * sin(a), y + u * sin(a) + v * cos(a)]);
const ngon = (r, n, a0 = 0, x = 0, y = 0) => [...Array(n)].map((_, i) => [x + r * cos(a0 + (i * TAU) / n), y + r * sin(a0 + (i * TAU) / n)]);
function hull(pts) {
  const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const half = (list) => list.reduce((h, p) => {
    while (h.length > 1 && cr(h[h.length - 2], h[h.length - 1], p) <= 0) h.pop();
    return h.push(p), h;
  }, []).slice(0, -1);
  pts.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  return half(pts).concat(half(pts.slice().reverse()));
}
const shadowOf = (pts, h) => hull([...pts, ...pts.map(([x, y]) => [x + SW[0] * h, y + SW[1] * h])]);
const trace = (g, pts) => { pts.forEach((p, i) => g[i ? "lineTo" : "moveTo"](p[0], p[1])); g.closePath(); };
const fill = (g, col, pts) => { g.beginPath(); trace(g, pts); g.fillStyle = col; g.fill(); };

// --- The plan: roads, house lots in rings, trees

const ROADS = ngon(1, 8, PI / 8).map(([x, y]) => ({ a: Math.atan2(y, x), x, y, nx: -y, ny: x }));
const inLot = (x, y, m) => abs(x) < 7.2 + m && y > -49.5 - m && y < -18.5 + m; // the church's
const plots = [];
// (fx, fy) points from a lot to its road; road -1 faces the square
function addPlot(p) {
  const wh = 8.5 * (0.6 + srand() * 0.14), back = (8.5 - wh) * 0.22; // the house sits back from the road
  plots.push(Object.assign(p, { cap: 5, res: 0, got: 0, house: null, wh, lh: 10 * (0.66 + srand() * 0.16), corners: rect(p.x, p.y, p.ang, 5, 4.25),
    hx: p.x - p.fx * back, hy: p.y - p.fy * back, ex: p.x + p.fx * 3.6, ey: p.y + p.fy * 3.6, door: p.fx * -sin(p.ang) + p.fy * cos(p.ang) > 0 ? 0 : 1 }));
}
ngon(1, 8).forEach(([c, s], k) => k !== 6 && addPlot({ ring: 1, x: c * 29, y: s * 29, ang: (k * PI) / 4 + PI / 2, fx: -c, fy: -s, road: -1, ax: c * 15.6, ay: s * 15.6 }));
[39, 51, 63].forEach((d, i) => ROADS.forEach((r, road) => [-1, 1].forEach((side) => {
  const x = r.x * d + r.nx * side * (RW + 5.55), y = r.y * d + r.ny * side * (RW + 5.55);
  if (!rect(x, y, r.a, 5, 4.25).some(([px, py]) => inLot(px, py, 1.2))) addPlot({ ring: i + 2, x, y, ang: r.a, fx: -side * r.nx, fy: -side * r.ny, road, side, d });
})));
// people per house: ring 1 holds 49, the outer ring what is left of the 300
let total = 0;
for (const p of plots) if (p.ring < 4) total += p.cap = p.ring === 1 ? 7 : 5;
const outer = plots.filter((p) => p.ring === 4), left = GOAL - total;
outer.forEach((p, i) => (p.cap = floor(left / outer.length) + ((i * 5) % outer.length < left % outer.length)));

const blocked = (x, y, m) => hypot(x, y) < SQ + 2 + m || inLot(x, y, m) || ROADS.some((r) => x * r.x + y * r.y > SQ_IN - 2 && abs(x * r.nx + y * r.ny) < RW + m)
  || plots.some((p) => abs((x - p.x) * cos(p.ang) + (y - p.y) * sin(p.ang)) < 5 + m && abs((y - p.y) * cos(p.ang) - (x - p.x) * sin(p.ang)) < 4.25 + m);
const trees = [];
for (let i = 0; i < 3000 && trees.length < 46; i++) {
  const a = srand() * TAU, r = SQ + 6 + Math.sqrt(srand()) * (R - SQ - 10), x = r * cos(a), y = r * sin(a), v = TREES[floor(srand() ** 1.5 * 6)]; // mostly green
  if (!blocked(x, y, 2.4) && !trees.some((t) => hypot(t.x - x, t.y - y) < 5.4)) trees.push({ x, y, v, r: v[1], h: v[2] });
}

// --- View and the pre-rendered ground

const canvas = $("c"), ctx = canvas.getContext("2d", { alpha: false });
const ground = document.createElement("canvas"), gctx = ground.getContext("2d");
let k = 1, cx = 0, cy = 0, K = 1, CX = 0, CY = 0, GT = [], wide = false;
const UP = R * T + 7, DOWN = R * T + RIM * HZ + 8; // island extent above and below its centre

function layout() {
  const w = innerWidth, h = innerHeight, dpr = min(2, devicePixelRatio || 1);
  if (!w || !h) return;
  canvas.width = ground.width = round(w * dpr);
  canvas.height = ground.height = round(h * dpr);
  wide = w / h > 1.45;
  const top = wide ? 14 : 80, ah = h - top - 14;
  k = max(0.2, min((w - 20) / (2 * R + 2), ah / (UP + DOWN)));
  [cx, cy, K] = [w / 2, top + UP * k + max(0, (ah - (UP + DOWN) * k) / 2), k * dpr];
  [CX, CY] = [cx * dpr, cy * dpr];
  GT = [K * COS, K * T * SIN, -K * SIN, K * T * COS, CX, CY]; // ground plane to device pixels
  renderGround();
  cache.clear();
  for (const d of statics) d.spr = null;
  makeRoom();
}
const toWorld = (px, py) => {
  const x = (px - cx) / k, y = (py - cy) / (k * T);
  return [x * COS + y * SIN, y * COS - x * SIN];
};

function renderGround() {
  const g = gctx, edge = ngon(R, 18, PI / 18);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = "#cfe5ec";
  g.fillRect(0, 0, ground.width, ground.height);
  edge.forEach((p, i) => {
    // the island's side: a grass lip over earth facets
    const q = edge[(i + 1) % 18], ax = vx(...p), ay = vy(...p), bx = vx(...q), by = vy(...q), m = hypot(ax + bx, ay + by);
    if (ay + by > 0) for (const [d0, d1, col] of [[0, 2.2, "#6fb24c"], [2.2, RIM, i % 2 ? "#b57f52" : "#ad784c"]]) {
      fill(g, lit(col, [(ax + bx) / m, (ay + by) / m, 0]), [[ax, ay, d0], [bx, by, d0], [bx, by, d1], [ax, ay, d1]].map(([x, y, d]) => [CX + x * K, CY + (y * T + d * HZ) * K]));
      g.strokeStyle = g.fillStyle;
      g.stroke();
    }
  });
  g.setTransform(...GT);
  fill(g, "#93d26a", edge);
  g.save();
  g.clip(); // roads end at the island's edge
  for (const [hw, col] of [[RW + 0.6, "#d8c49c"], [RW, "#ecdcb9"]]) for (const r of ROADS) fill(g, col, [[12, -hw], [R + 3, -hw], [R + 3, hw], [12, hw]].map(([d, o]) => [r.x * d + r.nx * o, r.y * d + r.ny * o]));
  [0.6, 0, -2.2, -4.4, -6.6, -8.8, -11, -13.2].forEach((r, i) => fill(g, i ? (i % 2 ? "#f1e9da" : "#e6dbc6") : "#d6c6a6", ngon(SQ + r, 8)));
  g.restore();
}

// --- Sprites: buildings, trees and settlers are drawn once into small canvases

const cache = new Map();
const cached = (key, make) => cache.get(key) || cache.set(key, make()).get(key);
function sheet(w, h) {
  const c = document.createElement("canvas");
  [c.width, c.height] = [max(1, Math.ceil(w)), max(1, Math.ceil(h))];
  return [c, c.getContext("2d")];
}
// A face of a convex solid (view space), dropped when it faces away
function face(out, pts, col, o) {
  const [a, b, c] = pts, u = [0, 1, 2].map((i) => b[i] - a[i]), v = [0, 1, 2].map((i) => c[i] - a[i]);
  const n = [u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]];
  const away = [0, 1, 2].reduce((s, i) => s + n[i] * (pts.reduce((t, p) => t + p[i], 0) / pts.length - o[i]), 0);
  const l = hypot(...n) * (away < 0 ? -1 : 1); // normal points away from the centre o
  if ((n[1] * 0.6 + n[2] * 0.8) / l < 0.02) return false;
  out.push({ p: pts, c: lit(col, n.map((q) => q / l)) });
  return true;
}
// Walls of a gabled block (u along the ridge): sides 0 (+v), 1 (-v), gables 2 (+u), 3 (-u)
function walls(out, ox, oy, a, L, W, h, rh, col) {
  const c = cos(a), s = sin(a), hu = L / 2, hv = W / 2, o = [ox, oy, (h + rh) / 3];
  const P = (u, v, z) => [ox + u * c - v * s, oy + u * s + v * c, z];
  const m = { P, hu, hv, h, rh, o };
  m.vis = [1, -1, 2, -2].map((e) => face(out, abs(e) < 2 ? [P(-hu, e * hv, 0), P(hu, e * hv, 0), P(hu, e * hv, h), P(-hu, e * hv, h)]
    : [P((e / 2) * hu, -hv, 0), P((e / 2) * hu, hv, 0), P((e / 2) * hu, hv, h), P((e / 2) * hu, 0, h + rh), P((e / 2) * hu, -hv, h)], col, o));
  return m;
}
function roof(out, { P, hu, hv, h, rh, o }, col, e = 0.55) {
  const dz = rh ? (e * rh) / hv : 0, x = rh ? hu + 0.35 : hu;
  for (const sd of [1, -1]) face(out, [P(-x, sd * (hv + e), h - dz), P(x, sd * (hv + e), h - dz), P(x, 0, h + rh), P(-x, 0, h + rh)], col, o);
}
// A door or window on a wall; u runs along it
function detail(out, m, side, u0, u1, z0, z1, col) {
  const { P, hu, hv } = m, e = side % 2 ? -1 : 1;
  const q = (u, z) => (side < 2 ? P(e * u, e * (hv + 0.07), z) : P(e * (hu + 0.07), e * u, z));
  if (m.vis[side]) face(out, [q(u0, z0), q(u1, z0), q(u1, z1), q(u0, z1)], col, m.o);
}
function bake(out) {
  const pr = (p) => [p[0] * K, (p[1] * T - p[2] * HZ) * K], all = out.flatMap((f) => f.p.map(pr));
  const xs = all.map((p) => p[0]), ys = all.map((p) => p[1]), ax = 3 - min(...xs), ay = 3 - min(...ys);
  const [c, g] = sheet(max(...xs) + ax + 3, max(...ys) + ay + 3);
  g.translate(ax, ay);
  g.lineJoin = "round";
  g.lineWidth = 0.7;
  for (const f of out) {
    fill(g, f.c, f.p.map(pr));
    g.strokeStyle = f.c;
    g.stroke(); // hides seams between faces
  }
  return { c, ax, ay };
}

function houseSprite(p, st) {
  const out = [], L = p.lh, h = st.h, m = walls(out, 0, 0, p.ang + YAW, L, p.wh, h, st.rh, st.wall);
  for (const z of h > 6 ? [1.3, h - 2.7] : [h * 0.36]) for (const side of [0, 1]) for (const u of [-0.3 * L, 0.3 * L]) detail(out, m, side, u - 0.58, u + 0.58, z, z + 1.35, "#4d6a85");
  detail(out, m, p.door, -0.75, 0.75, 0, 2.6, "#8a5536");
  roof(out, m, st.roof);
  return bake(out);
}

const CHURCH = { x: 0, y: -33 };
function churchSprite() {
  const out = [], a = PI / 2 + YAW, at = (y) => [vx(0, y + 33), vy(0, y + 33)];
  const nave = walls(out, ...at(-39.5), a, 19, 9.6, 9, 5.8, "#efe4cf");
  for (const side of [0, 1]) for (const u of [-6.2, -2.1, 2.1, 6.2]) detail(out, nave, side, u - 0.65, u + 0.65, 3, 6.8, "#4d6a85");
  roof(out, nave, "#d9573b", 0.6);
  const [tx, ty] = at(-24.8), tower = walls(out, tx, ty, a, 7.6, 7.6, 21, 0, "#e9dcc3");
  detail(out, tower, 2, -1.15, 1.15, 0, 3.6, "#8a5536");
  for (const side of [1, 2]) detail(out, tower, side, -0.95, 0.95, 15.6, 18.6, "#3d5168"); // belfry, on the two faces we see
  roof(out, tower, "#d9ccb2", 0);
  const base = ngon(4.3, 8, a + PI / 8, tx, ty).map(([x, y]) => [x, y, 21]); // an octagonal slate spire
  base.forEach((p, i) => face(out, [p, base[(i + 1) % 8], [tx, ty, 47]], "#58687d", [tx, ty, 27]));
  for (const [w, z0, z1] of [[0.2, 47, 50.6], [0.9, 49.1, 49.6]]) out.push({ p: [[tx - w, ty, z0], [tx + w, ty, z0], [tx + w, ty, z1], [tx - w, ty, z1]], c: "#f2c23b" });
  return bake(out);
}

// a trunk and a low-poly ball: an octagon with a lit fan and a shaded fan
const treeSprite = (t) => cached(t.v, () => {
  const [col, r, h] = t.v, [c, g] = sheet((r * 2 + 2) * K, (h + 1.5) * K), ax = c.width / 2, ay = c.height - 2;
  const V = ngon(r, 8, PI / 8, 0, r - h).map(([x, y]) => [x, r - h + (y - r + h) * 0.92]), o = [-r * 0.12, r * 0.9 - h];
  g.translate(ax, ay);
  g.scale(K, K);
  fill(g, "#7d5436", rect(0, -1.3, 0, 0.45, 1.3));
  fill(g, col, V);
  fill(g, shade(col, 1.13), [o, ...V.slice(3, 7)]);
  fill(g, shade(col, 0.8), [o, V[7], ...V.slice(0, 3)]);
  return { c, ax, ay };
});

// legs, a two-tone body, a head with hair
const settlerSprite = (i) => cached(i, () => {
  const u = K * 1.3, [c, g] = sheet(2.6 * u + 2, 4.6 * u + 2), ax = c.width / 2, ay = c.height - 1, cloth = CLOTHES[i % 10];
  g.translate(ax, ay);
  g.scale(u, u);
  g.lineCap = "round";
  for (const [col, w, x, y0, y1] of [["#414a5c", 0.95, 0, -0.5, -1.3], [shade(cloth, 0.84), 1.65, 0, -1.8, -2.3], [shade(cloth, 1.08), 0.8, -0.35, -1.75, -2.35]]) {
    [g.strokeStyle, g.lineWidth] = [col, w];
    g.beginPath();
    g.moveTo(x, y0);
    g.lineTo(x, y1);
    g.stroke();
  }
  fill(g, SKINS[i % 4], ngon(0.66, 12, 0, 0, -3.3));
  g.beginPath();
  g.arc(0, -3.36, 0.7, 3.3, 6.1);
  g.fillStyle = HAIR[(i + floor(i / 10)) % 4];
  g.fill();
  return { c, ax, ay };
});

// --- State

const statics = trees.map((t) => ({ ...t, dk: vy(t.x, t.y), tree: t })); // trees, houses, church
const pool = [...Array(160)].map(() => ({ on: false, pts: new Float32Array(16) })), free = [...pool];
const pointers = new Map(), list = [], scratch = new Float32Array(16);
let ring = 1, pop = 0, church = null, started = false, ended = false, liked = false;
let clock = 0, runTime = 0, animUntil = 0, overlays = true, pads, shades, yard = null;

function rebuildOverlays() {
  overlays = false;
  pads = new Path2D();
  for (const p of plots) if (p.ring <= ring) trace(pads, p.corners);
  shades = new Path2D();
  for (const t of trees) trace(shades, ngon(t.r * 0.85, 10, 0, t.x + SW[0] * t.h * 0.45, t.y + SW[1] * t.h * 0.45));
  for (const p of plots) if (p.house) trace(shades, p.house.shadow);
  church?.shadow.forEach((s) => trace(shades, s));
}

// --- Settlers hop out under the finger, run to a road, follow it to a free lot and wait there

const HOP = 0.28;
let routeLen = 0;
// Waypoints from (x, y) to the front of lot p, joining road ks (-1: on the square)
function route(x, y, ks, p, lane, out) {
  let n = 0, px = x, py = y;
  routeLen = 0;
  const add = (ax, ay) => {
    routeLen += hypot(ax - px, ay - py);
    out[n++] = px = ax;
    out[n++] = py = ay;
  };
  const onRoad = (r, d, o = lane) => add(r.x * d + r.nx * o, r.y * d + r.ny * o);
  if (ks >= 0) onRoad(ROADS[ks], clamp(x * ROADS[ks].x + y * ROADS[ks].y, SQ_IN, R - 3));
  if (ks < 0 || ks !== p.road) {
    if (ks >= 0) onRoad(ROADS[ks], SQ_IN);
    p.road < 0 ? add(p.ax, p.ay) : onRoad(ROADS[p.road], SQ_IN); // across the square
  }
  if (p.road >= 0) onRoad(ROADS[p.road], p.d, p.side * (RW - 0.9));
  add(p.ex, p.ey);
  return n;
}

function spawn(px, py) {
  if (!free.length) return false;
  let [x, y] = toWorld(px, py), r = hypot(x, y);
  if (r > R - 9) [x, y] = [(x * (R - 9)) / r, (y * (R - 9)) / r];
  const a = random() * TAU, d = rand(1.5, 4.5), hx = x + cos(a) * d, hy = y + sin(a) * d;
  // walk to the nearest road; the open lot with the shortest walk wins
  let ks = -1, near = 1e9, best = null, bestLen = 1e9;
  if (hypot(hx, hy) > SQ_IN - 0.5) ROADS.forEach((q, i) => {
    const d = abs(hx * q.nx + hy * q.ny);
    if (d < near && hx * q.x + hy * q.y > 0) [near, ks] = [d, i];
  });
  const lane = rand(-1, 1) * (RW - 1.2);
  for (const p of plots) if (p.ring <= ring && p.res < p.cap) {
    route(hx, hy, ks, p, lane, scratch);
    if (routeLen < bestLen) [bestLen, best] = [routeLen, p];
  }
  if (!best) return false;
  const s = free.pop(), still = calm();
  s.n = route(hx, hy, ks, best, lane, s.pts);
  // a place on the lot to wait for the house
  const j = best.res++, cols = Math.ceil(best.cap / 2), lu = ((j % cols) - (cols - 1) / 2) * 1.55, lv = j < cols ? 1.1 : -0.9;
  s.pts[s.n++] = best.x + cos(best.ang) * lu + best.fx * lv;
  s.pts[s.n++] = best.y + sin(best.ang) * lu + best.fy * lv;
  Object.assign(s, { on: true, wait: false, plot: best, i: 0, t: still ? HOP : 0, x0: x, y0: y, hx, hy, x: still ? hx : x, y: still ? hy : y, z: 0,
    spd: rand(21, 27), ph: random() * 6, look: floor(random() * 40) });
  // this ring is spoken for: open the next one
  if (ring < 4 && !plots.some((p) => p.ring === ring && p.res < p.cap)) [ring, overlays] = [ring + 1, true];
  return true;
}

function step(s, dt) {
  s.t += dt;
  if (s.t < HOP) {
    const p = s.t / HOP;
    [s.x, s.y, s.z] = [s.x0 + (s.hx - s.x0) * p, s.y0 + (s.hy - s.y0) * p, sin(PI * p) * 3.2];
    return;
  }
  if (s.wait) return;
  let d = s.spd * dt;
  while (d > 0 && s.i < s.n) {
    const ex = s.pts[s.i] - s.x, ey = s.pts[s.i + 1] - s.y, l = hypot(ex, ey);
    if (l <= d) [s.x, s.y, d, s.i] = [s.x + ex, s.y + ey, d - l, s.i + 2];
    else [s.x, s.y, d] = [s.x + (ex / l) * d, s.y + (ey / l) * d, 0];
  }
  s.z = calm() ? 0 : abs(sin(s.t * 13 + s.ph)) * 0.55;
  if (s.i < s.n) return;
  [s.wait, s.z] = [true, 0];
  const p = s.plot;
  p.got++;
  pop++;
  sTick();
  updateCount();
  if (p.got >= p.cap) buildHouse(p);
  if (!church && pop >= 150) raiseChurch();
  if (pop >= GOAL && !ended) finish();
}
const retire = (s) => free.push(Object.assign(s, { on: false }));

// --- Buildings

function buildHouse(p) {
  const tall = random() < (p.ring === 1 ? 0.7 : 0.22), st = { h: tall ? rand(6.4, 7.6) : rand(4.2, 5.2), rh: p.wh * rand(0.42, 0.56), wall: pick(WALLS), roof: pick(ROOFS) };
  p.house = { x: p.hx, y: p.hy, dk: vy(p.hx, p.hy), born: clock, dur: 0.5, make: () => houseSprite(p, st), shadow: shadowOf(rect(p.hx, p.hy, p.ang, p.lh / 2, p.wh / 2), st.h + st.rh * 0.6) };
  statics.push(p.house);
  for (const s of pool) if (s.on && s.plot === p) retire(s); // everyone moves in
  sPop();
  animUntil = max(animUntil, clock + 0.6);
  overlays = true;
}
function raiseChurch() {
  church = { ...CHURCH, dk: vy(CHURCH.x, CHURCH.y), born: clock, dur: 1.4, rise: true, make: churchSprite };
  church.shadow = [shadowOf(rect(0, -39.5, PI / 2, 9.5, 4.8), 12.5), hull([...shadowOf(rect(0, -24.8, PI / 2, 3.8, 3.8), 21), [SW[0] * 47, -24.8 + SW[1] * 47]])];
  trace((yard = new Path2D()), rect(0, -34, PI / 2, 15.5, 7.2));
  statics.push(church);
  sBell();
  animUntil = max(animUntil, clock + 1.5);
  overlays = true;
}

// --- Drawing

function blit({ c, ax, ay }, X, Y, sx = 1, sy = 1, alpha = 1) {
  if (sx === 1 && sy === 1 && alpha === 1) return ctx.drawImage(c, round(X - ax), round(Y - ay));
  ctx.globalAlpha = alpha;
  ctx.setTransform(sx, 0, 0, sy, X, Y);
  ctx.drawImage(c, -ax, -ay);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
}
// a house squashes and stretches; the church rises with a small overshoot
const spring = (p) => 1 - cos(3 * PI * p) * Math.exp(-5 * p) * 0.9;
const rise = (p) => max(0.02, 1 + 2.2 * (p - 1) ** 3 + 1.2 * (p - 1) ** 2);

function draw() {
  if (overlays) rebuildOverlays();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(ground, 0, 0);
  ctx.setTransform(...GT); // flat things, in world units
  ctx.fillStyle = "#c1e7a0";
  ctx.fill(pads);
  ctx.fillStyle = "#ebe2cf";
  if (yard) ctx.fill(yard);
  ctx.fillStyle = "#1a403033";
  ctx.fill(shades);
  ctx.beginPath();
  for (const s of pool) if (s.on) {
    ctx.moveTo(s.x + 1.2, s.y - 0.3);
    ctx.arc(s.x + 0.3, s.y - 0.3, 0.9, 0, TAU);
  }
  ctx.fill();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  // everything that stands up, back to front
  list.length = 0;
  list.push(...statics);
  for (const s of pool) if (s.on) list.push(s), (s.dk = vy(s.x, s.y));
  list.sort((a, b) => a.dk - b.dk);
  const still = calm();
  for (const d of list) {
    const X = CX + K * vx(d.x, d.y), Y = CY + K * (vy(d.x, d.y) * T - (d.z || 0) * HZ);
    if (d.pts) {
      const g = d.t < HOP && !still ? 0.45 + (0.55 * d.t) / HOP : 1;
      blit(settlerSprite(d.look), X, Y, g, g);
    } else if (d.tree) blit(treeSprite(d.tree), X, Y);
    else {
      const spr = (d.spr ||= d.make()), p = min(1, (clock - d.born) / (still ? 0.3 : d.dur)), sy = d.rise ? rise(p) : spring(p);
      if (p >= 1) blit(spr, X, Y);
      else if (still) blit(spr, X, Y, 1, 1, p); // reduced motion: fade in, no bounce
      else blit(spr, X, Y, d.rise ? 1 : 1 + (1 - sy) * 0.45, sy);
    }
  }
}

// --- Loop: runs while something moves; stops when idle or hidden

let raf = 0, running = false, lastT = 0;
function wake() {
  if (running || document.hidden) return;
  running = true;
  lastT = performance.now();
  raf = requestAnimationFrame(frame);
}
function frame(now) {
  const dt = min(0.05, max(0, (now - lastT) / 1000));
  lastT = now;
  clock += dt;
  if (started && !ended) runTime += dt;
  for (const p of pointers.values()) {
    p.held += dt;
    p.acc = min(3, p.acc + dt * (5 + 3 * min(1, p.held / 5))); // a stream that speeds up while you hold
    while (p.acc >= 1 && !ended && spawn(p.x, p.y)) p.acc--;
  }
  let moving = 0;
  for (const s of pool) if (s.on) step(s, dt), (moving += s.on && !s.wait);
  draw();
  if (pointers.size || moving || clock < animUntil) raf = requestAnimationFrame(frame);
  else running = false;
}

// --- HUD, end card, messages to the host page

const [nEl, unitEl, barEl, hint, muteBtn, endEl, card, meta, likeBtn, thanks, again] = ["n", "unit", "bar", "hint", "mute", "end", "card", "meta", "like", "thanks", "again"].map($);
function updateCount() {
  nEl.textContent = pop;
  unitEl.textContent = pop === 1 ? "person" : "people";
  barEl.style.transform = `scaleX(${pop / GOAL})`;
}
function post(type, extra) {
  if (window.parent !== window) try { window.parent.postMessage({ source: "nag-toy", game: "pocket-metropolis", type, ...extra }, "*"); } catch {}
}
function finish() {
  ended = true;
  pointers.clear();
  const score = max(1, round(runTime));
  let best = parseInt(load(BEST_KEY), 10);
  const isBest = !(best > 0) || score < best;
  if (isBest) save(BEST_KEY, (best = score));
  meta.textContent = `Built in ${score} s. ${isBest ? "New best!" : `Best: ${best} s`}`;
  post("end", { score });
  sFanfare();
  setTimeout(() => {
    endEl.hidden = false;
    makeRoom();
  }, calm() ? 500 : 1100);
}
// Slide and shrink the canvas so the village stays in view beside the card
function makeRoom() {
  if (endEl.hidden) return;
  const top = 70, aw = wide ? endEl.offsetLeft + card.offsetLeft - 8 : innerWidth; // offsets ignore the entrance animation
  const ah = (wide ? innerHeight - 8 : endEl.offsetTop + card.offsetTop - 8) - top, s = min(1, (aw - 16) / (2 * R * k), ah / ((UP + DOWN) * k));
  canvas.style.transform = `translate(${aw / 2 - s * cx}px, ${top + ah / 2 - s * (cy + ((DOWN - UP) * k) / 2)}px) scale(${s})`;
}
likeBtn.onclick = () => {
  liked = true;
  post("like");
  [likeBtn.hidden, thanks.hidden] = [true, false];
};
again.onclick = () => {
  pool.forEach((s) => s.on && retire(s));
  for (const p of plots) [p.res, p.got, p.house] = [0, 0, null];
  statics.length = trees.length;
  [ring, pop, runTime, started, ended, overlays, church, yard, endEl.hidden] = [1, 0, 0, false, false, true, null, null, true];
  canvas.style.transform = "";
  hint.classList.remove("gone");
  updateCount();
  wake();
};

// --- Input: each finger is a stream of settlers

canvas.addEventListener("pointerdown", (e) => {
  if (ended || (e.pointerType === "mouse" && e.button)) return;
  e.preventDefault();
  audioUp();
  try { canvas.setPointerCapture(e.pointerId); } catch {}
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, held: 0, acc: 0 });
  if (!started) {
    started = true;
    post("start");
    hint.classList.add("gone");
  }
  for (let i = 0; i < 3; i++) spawn(e.clientX, e.clientY); // a small burst on every tap
  wake();
});
canvas.addEventListener("pointermove", (e) => {
  const p = pointers.get(e.pointerId);
  if (p) [p.x, p.y] = [e.clientX, e.clientY];
});
for (const type of ["pointerup", "pointercancel", "lostpointercapture"]) canvas.addEventListener(type, (e) => {
  pointers.delete(e.pointerId);
  if (type === "pointerup") audioUp(); // a touch is a user gesture only once the finger lifts
});
canvas.addEventListener("contextmenu", (e) => e.preventDefault());
addEventListener("resize", () => {
  layout();
  draw();
  wake();
});
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    cancelAnimationFrame(raf);
    running = false;
    pointers.clear();
    quiet(ac?.suspend());
  } else {
    if (!muted) quiet(ac?.resume());
    wake();
  }
});

// --- Sound, synthesised; the context starts from the first touch

let ac = null, master = null, voices = 0, lastPop = 0, lastTick = 0, muted = load(SOUND_KEY) === "off";
const quiet = (pr) => pr?.catch?.(() => {});
function audioUp() {
  if (muted || document.hidden) return;
  try {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain();
      master.gain.value = 0.25;
      master.connect(ac.destination);
    }
    if (ac.state !== "running") quiet(ac.resume());
  } catch {}
}
// One voice: a glide, a soft attack, an exponential fade (no clicks)
function note(f0, f1, at, dur, peak, type = "sine") {
  if (!ac || muted || ac.state !== "running" || voices >= 20) return;
  const t = ac.currentTime + at, o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f1, t + dur * 0.6);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + min(0.012, dur / 4));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(master);
  o.start(t);
  o.stop(t + dur + 0.03);
  voices++;
  o.onended = () => (voices--, g.disconnect());
}
function sPop() {
  if (ac?.currentTime - lastPop < 0.07 || voices > 12) return; // rate limited
  lastPop = ac?.currentTime;
  const f = pick([523, 587, 659, 784, 880, 1047]) * rand(0.97, 1.03); // pentatonic, slightly detuned
  note(f * 1.4, f * 0.55, 0, 0.17, 0.55);
  note(f * 2, f * 1.1, 0, 0.08, 0.1, "triangle");
}
function sTick() {
  if (ac?.currentTime - lastTick < 0.09 || random() < 0.45) return;
  lastTick = ac?.currentTime;
  note(rand(1800, 2400), 1500, 0, 0.035, 0.09);
}
// a small bell: three strikes of inharmonic partials; a fanfare at the end
const sBell = () => [784, 659, 784].forEach((f, i) => [[1, 1.6, 1], [2.76, 0.6, 0.3], [5.4, 0.25, 0.12]].forEach(([m, dur, g]) => note(f * m, f * m, i * 0.42, dur, (0.42 - i * 0.05) * g)));
function sFanfare() {
  [523, 659, 784].forEach((f, i) => note(f, f, i * 0.12, 0.22, 0.38, "triangle"));
  [523, 659, 784, 1047].forEach((f) => note(f, f, 0.38, 1, 0.22, "triangle"));
}
function setMuted(m, keep) {
  muted = m;
  if (keep) save(SOUND_KEY, m ? "off" : "on");
  muteBtn.setAttribute("aria-pressed", !m);
  muteBtn.setAttribute("aria-label", m ? "Sound off" : "Sound on");
  if (ac) master.gain.setTargetAtTime(m ? 0 : 0.25, ac.currentTime, 0.02);
  if (!m && keep) audioUp(); // only a click may start audio
}
muteBtn.onclick = () => setMuted(!muted, true);
addEventListener("storage", (e) => e.key === SOUND_KEY && setMuted(e.newValue === "off")); // shared with the site and the other toys
setMuted(muted);

updateCount();
layout();
draw();
post("ready");
</script>
</body>
