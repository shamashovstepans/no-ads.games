<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Cosmo: hold to gather stardust</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0a26">
<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Onest:wght@400;600&display=swap">
<style>
:root {
  --bg: #0b0a26; --ink: #efeaff; --soft: #b9b0dc;
  --violet: #a98bff; --pink: #ff9ad5; --gold: #ffd27a;
  --display: "Bagel Fat One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --text: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  color: var(--ink);
  font: 400 16px/1.4 var(--text);
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
  /* deep space with a faint violet nebula behind the object */
  background:
    radial-gradient(60vmax 60vmax at 50% 52%, rgb(92 60 190 / 0.22), transparent 62%),
    radial-gradient(40vmax 30vmax at 18% 88%, rgb(200 90 190 / 0.08), transparent 70%),
    var(--bg);
}
canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }

.hud {
  position: fixed; top: max(16px, env(safe-area-inset-top)); left: 60px; right: 60px;
  display: grid; justify-items: center; gap: 8px;
  pointer-events: none;
}
.bar { width: min(100%, 240px); height: 4px; border-radius: 4px; background: rgb(185 176 220 / 0.18); overflow: hidden; }
.bar i {
  display: block; height: 100%; border-radius: inherit;
  background: linear-gradient(90deg, var(--violet), var(--pink) 60%, var(--gold));
  transform: scaleX(0); transform-origin: left;
}
.stage { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.02em; color: var(--soft); white-space: nowrap; }
.stage b { font-weight: 600; color: var(--ink); }

.mute {
  position: fixed; top: max(4px, env(safe-area-inset-top)); right: max(4px, env(safe-area-inset-right)); z-index: 3;
  display: grid; place-items: center; width: 44px; height: 44px; padding: 0;
  border: 0; border-radius: 50%; background: none; color: var(--soft);
  cursor: pointer; touch-action: manipulation;
}
.mute:hover { color: var(--ink); }
.mute:focus-visible { outline: 2px solid currentColor; outline-offset: -4px; }
.mute svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.mute .spk { fill: currentColor; }
.mute[aria-pressed="true"] .off, .mute[aria-pressed="false"] .on { display: none; }

.hint {
  position: fixed; left: 16px; right: 16px; bottom: max(12%, 48px); margin: 0;
  text-align: center; font-weight: 600; letter-spacing: 0.01em;
  text-shadow: 0 1px 12px rgb(11 10 38 / 0.9);
  pointer-events: none;
  animation: breathe 2.6s ease-in-out infinite alternate;
  transition: opacity 0.6s;
}
.hint.gone { opacity: 0; animation: none; }
@keyframes breathe { from { opacity: 0.55; } }

/* End card: sits low (or right, in landscape) so the star stays in view */
.end {
  position: fixed; inset: 0; z-index: 2; display: flex; overflow-y: auto;
  padding: 56px 16px max(20px, env(safe-area-inset-bottom));
  background: linear-gradient(to bottom, transparent 35%, rgb(11 10 38 / 0.8));
  animation: fade 0.5s both;
}
.end[hidden] { display: none; }
.card {
  width: min(100%, 360px); margin: auto auto 0; padding: 26px 22px 20px;
  border-radius: 26px; text-align: center;
  background: linear-gradient(rgb(46 35 108 / 0.94), rgb(23 18 64 / 0.96));
  box-shadow: 0 0 0 1px rgb(185 176 220 / 0.2), 0 24px 60px -20px rgb(0 0 0 / 0.75);
  animation: pop 0.55s cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
}
.card:focus { outline: none; }
.card h1 { margin: 0 0 8px; font: 400 clamp(26px, 7.4vw, 32px) / 1.08 var(--display); text-wrap: balance; }
.best { margin: 0 0 18px; font-size: 15px; color: var(--soft); }
.cta {
  display: block; padding: 14px 18px; border-radius: 999px;
  background: linear-gradient(135deg, var(--gold), var(--pink));
  color: #1d1240; font-size: 17px; font-weight: 600; line-height: 1.25; text-decoration: none;
  box-shadow: 0 10px 26px -12px rgb(255 160 210 / 0.8);
}
.cta:focus-visible, .again:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.note { margin: 9px 0 16px; font-size: 13px; color: var(--soft); text-wrap: balance; }
.again {
  min-height: 44px; padding: 12px 24px; border: 1px solid rgb(185 176 220 / 0.45); border-radius: 999px;
  background: none; color: var(--ink); font: 600 16px/1 var(--text); cursor: pointer;
}
.again:hover { background: rgb(185 176 220 / 0.12); }
@keyframes pop { from { opacity: 0; transform: translateY(14px) scale(0.96); } }
@keyframes fade { from { opacity: 0; } }

@media (min-aspect-ratio: 6/5) {
  .end { background: linear-gradient(to right, transparent 40%, rgb(11 10 38 / 0.75)); }
  .card { margin: auto 0 auto auto; }
}
@media (prefers-reduced-motion: reduce) {
  .hint { animation: none; }
  .card { animation-name: fade; }
}
</style>
</head>
<body>
<canvas id="sky" role="img" aria-label="Stardust toy: hold anywhere, or hold Space, to gather stardust"></canvas>

<div class="hud">
  <div class="bar"><i id="fill"></i></div>
  <p class="stage" id="stage" aria-live="polite"><b id="cur">Dust cloud</b><span id="next"> → Asteroid</span></p>
</div>

<button class="mute" id="mute" type="button" aria-label="Sound on" aria-pressed="true">
  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <path class="spk" d="M4 9.5h3.2L12 5.6v12.8l-4.8-3.9H4z"/>
    <path class="on" d="M15.6 9.2a4 4 0 0 1 0 5.6M18.2 6.6a7.6 7.6 0 0 1 0 10.8"/>
    <path class="off" d="m16 9.5 5 5m0-5-5 5"/>
  </svg>
</button>

<p class="hint" id="hint">Hold anywhere to gather stardust</p>

<div class="end" id="end" hidden>
  <div class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="endTitle" tabindex="-1">
    <h1 id="endTitle">You grew a star in 0 seconds</h1>
    <p class="best" id="best"></p>
    <a class="cta" id="cta" href="https://apps.apple.com/app/apple-store/id6810904381?pt=127670757&amp;ct=no-ads.games-toy&amp;mt=8" target="_top">Grow a universe in Pocket&nbsp;Cosmo</a>
    <p class="note">Free on iPhone. Available in select countries for now.</p>
    <button class="again" id="again" type="button">Play again</button>
  </div>
</div>

<script type="module">
const $ = (id) => document.getElementById(id);
const canvas = $("sky"), ctx = canvas.getContext("2d");
const BEST_KEY = "nag.toy.cosmo.best", SOUND_KEY = "nag.sound";

// Mass per stage: about 48 s of steady holding reaches the star
const STAGES = [
  { name: "Dust cloud", at: 0 },
  { name: "Asteroid", at: 150 },
  { name: "Planet", at: 450 },
  { name: "Star", at: 960 },
];
const RATE = 20;       // grains per second per finger
const TAP_BURST = 8;   // grains on every touch
const MORPH = 1.25;    // seconds per evolution

// Look per stage; r0..r1 is the radius as the stage fills, as a share of the short side
const LOOKS = [
  { r0: 0.15, r1: 0.18, lump: 0.12, jit: 0.34, alpha: 0.3, amb: 0.55, dif: 0.6, spec: 0.2, sh: [70, 48, 150],
    cols: [[150, 118, 255], [214, 150, 245], [186, 172, 255]] },
  { r0: 0.105, r1: 0.145, lump: 0.3, jit: 0.07, alpha: 1, amb: 0.3, dif: 0.85, spec: 0.15, sh: [42, 30, 88],
    cols: [[118, 100, 172], [152, 118, 188], [96, 84, 152]] },
  { r0: 0.17, r1: 0.205, lump: 0.02, jit: 0.015, alpha: 1, amb: 0.3, dif: 0.85, spec: 0.5, sh: [58, 34, 132],
    cols: [[146, 108, 248], [240, 150, 222], [204, 186, 255]] },
  { r0: 0.235, r1: 0.235, lump: 0, jit: 0, alpha: 1, amb: 0.75, dif: 0.4, spec: 0.9, sh: [226, 120, 50],
    cols: [[255, 206, 112], [255, 240, 206], [255, 184, 96]] },
];
const GRAIN_RGB = ["169,139,255", "255,154,213", "255,210,122"];

const motion = matchMedia("(prefers-reduced-motion: reduce)");
let reduced = motion.matches;
motion.addEventListener?.("change", () => { reduced = motion.matches; });

// Messages for the host page; silent when opened directly
function tell(type, extra) {
  if (window.parent === window) return;
  try { window.parent.postMessage({ source: "nag-toy", game: "pocket-cosmo", type, ...extra }, "*"); } catch (e) {}
}
const load = (key) => { try { return localStorage.getItem(key); } catch (e) { return null; } };
const save = (key, value) => { try { localStorage.setItem(key, value); } catch (e) {} };
const lerp = (a, b, k) => a + (b - a) * k;
const mix = (a, b, k) => (Array.isArray(a) ? a.map((x, i) => mix(x, b[i], k)) : lerp(a, b, k));
const rand = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;

// --- Sound: Web Audio synths, started by the first touch ---

const VOLUME = 0.25, PENTA = [0, 2, 4, 7, 9];
const hz = (n) => 196 * 2 ** ((12 * Math.floor(n / 5) + PENTA[n % 5]) / 12);
let ac = null, master, bus, voices = 0, lastNote = 0, noteIdx = 6;
let muted = load(SOUND_KEY) === "off";

function audioStart() {
  if (muted) return;
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      ac = new AC();
      master = ac.createGain();
      master.gain.value = VOLUME;
      master.connect(ac.destination);
      bus = ac.createGain();
      bus.connect(master);
      // a soft echo gives the notes some room
      const delay = ac.createDelay(1), feedback = ac.createGain(), tone = ac.createBiquadFilter(), wet = ac.createGain();
      delay.delayTime.value = 0.32;
      feedback.gain.value = wet.gain.value = 0.3;
      tone.frequency.value = 1900;
      bus.connect(delay); delay.connect(tone); tone.connect(feedback); feedback.connect(delay);
      tone.connect(wet); wet.connect(master);
    } catch (e) { ac = null; return; }
  }
  if (ac.state !== "running") ac.resume().catch(() => {});
}
const audible = () => ac && !muted && ac.state === "running";

// A soft bell: a sine body and a quick glassy overtone, no clicks
function pluck(freq, vel, at = 0) {
  if (!audible() || voices >= (at ? 12 : 6)) return;
  const t = Math.max(at, ac.currentTime);
  voices++;
  [[1, vel, 0.012, 0.28], [4.01, vel * 0.16, 0.006, 0.05]].forEach(([ratio, peak, rise, tau], i) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = freq * ratio;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(peak, t + rise);
    g.gain.setTargetAtTime(0, t + rise, tau);
    o.connect(g);
    g.connect(bus);
    o.start(t);
    o.stop(t + 1.6);
    o.onended = () => { g.disconnect(); if (!i) voices--; };
  });
}

// Absorb notes: about 4 a second at most, walking a pentatonic scale
function grainNote() {
  if (!audible() || ac.currentTime - lastNote < 0.24) return;
  lastNote = ac.currentTime + Math.random() * 0.08;
  const lo = 4 + stage;
  noteIdx = Math.min(lo + 6, Math.max(lo, noteIdx + [-2, -1, -1, 1, 1, 2][(Math.random() * 6) | 0]));
  pluck(hz(noteIdx), rand(0.09, 0.13));
}

// A warm chord that glides up in pitch while its filter opens
function chord(root, steps, attack, hold, release, peak) {
  if (!audible()) return;
  const t = ac.currentTime, end = t + attack + hold + release * 6;
  const filter = ac.createBiquadFilter(), g = ac.createGain();
  filter.Q.value = 0.6;
  filter.frequency.setValueAtTime(320, t);
  filter.frequency.exponentialRampToValueAtTime(2600, t + attack + 0.2);
  filter.frequency.exponentialRampToValueAtTime(900, end);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(peak, t + attack);
  g.gain.setTargetAtTime(0, t + attack + hold, release);
  filter.connect(g);
  g.connect(bus);
  steps.forEach((step, i) => {
    const o = ac.createOscillator();
    o.type = i % 2 ? "sine" : "triangle";
    o.frequency.value = root * 2 ** (step / 12);
    o.detune.setValueAtTime(-260, t);
    o.detune.linearRampToValueAtTime((i - 2) * 4, t + attack + 0.15);
    o.connect(filter);
    o.start(t);
    o.stop(end);
    if (!i) o.onended = () => g.disconnect();
  });
}
function evolveSound() {
  if (stage < 3) return chord([0, 146.8, 164.8][stage], [0, 7, 12, 16, 19], 0.55, 0.35, 0.5, 0.075);
  chord(98, [0, 7, 12, 16, 19, 23, 26], 0.9, 1.2, 1.1, 0.06);
  if (ac) [0, 2, 4, 6, 9].forEach((n, i) => pluck(hz(5 + n), 0.08, ac.currentTime + 0.35 + i * 0.2));
}

function audioPause() {
  if (!ac) return;
  master.gain.setTargetAtTime(0, ac.currentTime, 0.015);
  setTimeout(() => { if (ac && (document.hidden || muted)) ac.suspend().catch(() => {}); }, 150);
}
function audioResume() {
  if (!ac || muted || document.hidden) return;
  ac.resume().catch(() => {});
  master.gain.cancelScheduledValues(ac.currentTime);
  master.gain.setTargetAtTime(VOLUME, ac.currentTime, 0.06);
}

const muteBtn = $("mute");
function setMuted(m, fromElsewhere) {
  muted = m;
  if (!fromElsewhere) save(SOUND_KEY, m ? "off" : "on");
  muteBtn.setAttribute("aria-pressed", String(!m));
  muteBtn.setAttribute("aria-label", m ? "Sound off" : "Sound on");
  if (m) audioPause();
  else { if (!fromElsewhere) audioStart(); audioResume(); }
}
// after a tap or click, drop focus so Space keeps gathering instead of toggling the button
muteBtn.addEventListener("click", (e) => { setMuted(!muted); if (e.detail) muteBtn.blur(); });
// the rest of the site shares this setting
addEventListener("storage", (e) => { if (e.key === SOUND_KEY) setMuted(e.newValue === "off", true); });
setMuted(muted, true);

// --- Scene ---

let W = 0, H = 0, S = 0, dpr = 1, cx = 0, cy = 0, homeX = 0, homeY = 0, wide = false, starCount = 0;
const stars = Array.from({ length: 140 }, () =>
  ({ x: Math.random(), y: Math.random(), s: rand(0.6, 1.8), a: rand(0.25, 0.9), ph: rand(0, TAU), sp: rand(0.3, 1.1) }));

function resize() {
  W = innerWidth;
  H = innerHeight;
  dpr = Math.min(2, devicePixelRatio || 1);
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  S = Math.min(W, H);
  wide = W > H * 1.2;
  cx = homeX = W / 2;
  cy = homeY = H / 2 + Math.min(16, H * 0.02);
  starCount = Math.max(30, Math.min(140, Math.round((W * H) / 6000)));
}

// Soft round sprites, drawn once
function sprite(rgb, size, core) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const g = c.getContext("2d"), h = size / 2, grad = g.createRadialGradient(h, h, 0, h, h, h);
  if (core) grad.addColorStop(0, "#fff");
  grad.addColorStop(core ? 0.2 : 0, `rgba(${rgb},${core ? 1 : 0.8})`);
  grad.addColorStop(core ? 0.45 : 0.4, `rgba(${rgb},0.3)`);
  grad.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = grad;
  g.fillRect(0, 0, size, size);
  return c;
}
const DOTS = GRAIN_RGB.map((rgb) => sprite(rgb, 32, true));
const GLOW = sprite("140,105,255", 128), WARM = sprite("255,196,110", 128), WHITE = sprite("236,226,255", 128);

// Low-poly ball: an icosahedron split once (42 vertices, 80 facets)
const MESH = (() => {
  const t = (1 + Math.sqrt(5)) / 2;
  const v = [[-1, t, 0], [1, t, 0], [-1, -t, 0], [1, -t, 0], [0, -1, t], [0, 1, t], [0, -1, -t], [0, 1, -t], [t, 0, -1], [t, 0, 1], [-t, 0, -1], [-t, 0, 1]];
  const ico = [[0, 11, 5], [0, 5, 1], [0, 1, 7], [0, 7, 10], [0, 10, 11], [1, 5, 9], [5, 11, 4], [11, 10, 2], [10, 7, 6], [7, 1, 8],
    [3, 9, 4], [3, 4, 2], [3, 2, 6], [3, 6, 8], [3, 8, 9], [4, 9, 5], [2, 4, 11], [6, 2, 10], [8, 6, 7], [9, 8, 1]];
  const cache = {};
  const mid = (a, b) => {
    const key = Math.min(a, b) + "_" + Math.max(a, b);
    if (cache[key] === undefined) { cache[key] = v.length; v.push(v[a].map((x, i) => (x + v[b][i]) / 2)); }
    return cache[key];
  };
  const faces = ico.flatMap(([a, b, c]) => {
    const ab = mid(a, b), bc = mid(b, c), ca = mid(c, a);
    return [[a, ab, ca], [b, bc, ab], [c, ca, bc], [ab, bc, ca]];
  });
  const verts = v.map((p) => p.map((x) => x / Math.hypot(...p)));
  return {
    verts, faces,
    // smooth bumps for the asteroid, ragged jitter for the cloud
    lump: verts.map(([x, y, z]) => 0.5 * Math.sin(2.3 * x + 1.7 * y + 0.5) + 0.35 * Math.sin(3.7 * y - 2.1 * z + 1.1) + 0.3 * Math.sin(4.3 * z + 2.9 * x + 2.3)),
    jit: verts.map(() => rand(-1, 1)),
    // per facet: a palette colour (in loose patches) and a brightness offset
    tone: faces.map((f) => {
      const k = f.reduce((sum, i) => sum + 0.45 * verts[i][1] - 0.3 * verts[i][0], 0) + rand(-0.9, 0.9);
      return k > 0.55 ? 2 : k < -0.55 ? 1 : 0;
    }),
    vary: faces.map(() => rand(0.9, 1.08)),
  };
})();
const NV = MESH.verts.length, NF = MESH.faces.length;
const PX = new Float32Array(NV), PY = new Float32Array(NV), PZ = new Float32Array(NV);
const FL = new Float32Array(NF), FZ = new Float32Array(NF), order = [];
const byDepth = (p, q) => FZ[p] - FZ[q];
const LIGHT = [-0.5, 0.62, 0.66].map((x, i, l) => x / Math.hypot(...l));
const TILT = 0.38;

// Dust specks circling the cloud, gold beads on the planet's ring
const specks = Array.from({ length: 64 }, () => ({ a: rand(0, TAU), r: rand(0.55, 1.75), sp: rand(0.25, 0.7), s: rand(1.5, 3.2), c: +(Math.random() > 0.7) }));
const beads = Array.from({ length: 30 }, () => ({ a: rand(0, TAU), l: Math.random() < 0.5 ? rand(0.9, 0.97) : rand(1.03, 1.1), s: rand(1.2, 2.4) }));

// --- State ---

let mass = 0, stage = 0, morph = 1, flashed = true, running = false, ended = false;
let runTime = 0, endDelay = 0, score = 0, cardAt = 0, aside = 0;
let time = 0, spin = 0, pulse = 0, flash = 0, bar = 0, barSet = -1, curR = 0;
const fingers = new Map();
const grains = Array.from({ length: 400 }, () => ({ on: false }));
const free = grains.slice();
const sparks = Array.from({ length: 140 }, () => ({ on: false }));

// --- Grains: each one flies a short spiral into the object ---

function spawn(x, y, spread) {
  const g = free.pop();
  if (!g) return;
  const dx = x - cx + rand(-spread, spread), dy = y - cy + rand(-spread, spread);
  const r0 = Math.max(Math.hypot(dx, dy), curR * 1.35 + 14), gold = 0.16 + stage * 0.08, pick = Math.random();
  Object.assign(g, {
    on: true, t: 0, r0, th: Math.atan2(dy, dx),
    d: 0.8 + 0.55 * Math.min(1, r0 / (0.5 * S)) + rand(0, 0.3), // flight time, s
    sw: -rand(0.55, 1.15), // swirl, radians
    bu: r0 * rand(0.04, 0.14), // drift outwards before the fall
    c: pick < gold ? 2 : pick < gold + (1 - gold) * 0.55 ? 0 : 1,
    s: rand(2, 3.4),
  });
}

// Position at progress u (0..1); it speeds up as it falls in
let gx = 0, gy = 0;
function grainAt(g, u) {
  const e = u * u, r = g.r0 + (curR * 0.78 - g.r0) * e + Math.sin(u * Math.PI) * g.bu, a = g.th + g.sw * e;
  gx = cx + r * Math.cos(a);
  gy = cy + r * Math.sin(a);
}

function spark(x, y, vx, vy, life, c, s) {
  const p = sparks.find((q) => !q.on);
  if (p) Object.assign(p, { on: true, x, y, vx, vy, life, max: life, c, s });
}

function absorb(g) {
  g.on = false;
  free.push(g);
  grainAt(g, 1);
  spark(gx, gy, 0, 0, 0.3, g.c, 5);
  if (ended) return;
  mass++;
  if (!reduced) pulse = Math.min(pulse + 0.012, 0.07);
  grainNote();
  if (mass >= (STAGES[stage + 1]?.at ?? Infinity)) evolve();
}

// Mid-evolution flash and a ring of grains (gentle with reduced motion)
function burst() {
  if (!reduced) flash = 0.5;
  for (let i = 0; i < (reduced ? 14 : 56); i++) {
    const a = rand(0, TAU), v = (reduced ? rand(12, 36) : rand(90, 280)) * S / 400, r = curR * 0.85;
    spark(cx + Math.cos(a) * r, cy + Math.sin(a) * r, Math.cos(a) * v, Math.sin(a) * v, reduced ? 1.6 : rand(0.7, 1.3), i % 3, rand(3, 6));
  }
}

function evolve() {
  stage++;
  morph = 0;
  flashed = false;
  bar = 0;
  showStage();
  evolveSound();
  if (stage === STAGES.length - 1) {
    ended = true;
    fingers.clear();
    score = Math.max(1, Math.round(runTime));
    endDelay = 2.2;
    tell("end", { score });
  }
}

const fillEl = $("fill");
function showStage() {
  $("cur").textContent = STAGES[stage].name;
  $("next").textContent = stage < STAGES.length - 1 ? " → " + STAGES[stage + 1].name : "";
}

// --- Input: every finger makes its own stream ---

function press(id, x, y) {
  if (ended) return;
  audioStart();
  if (!running) {
    running = true;
    runTime = 0;
    $("hint").classList.add("gone");
    tell("start");
  }
  fingers.set(id, { x, y, acc: 0 });
  for (let i = 0; i < TAP_BURST; i++) spawn(x, y, 22);
}
function release(id) {
  fingers.delete(id);
  // some browsers allow audio only once a touch ends
  if (ac && !document.hidden) audioStart();
}

canvas.addEventListener("pointerdown", (e) => {
  if (e.button > 0) return;
  e.preventDefault();
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  press(e.pointerId, e.clientX, e.clientY);
});
canvas.addEventListener("pointermove", (e) => {
  const f = fingers.get(e.pointerId);
  if (f) { f.x = e.clientX; f.y = e.clientY; }
});
for (const type of ["pointerup", "pointercancel", "lostpointercapture"]) canvas.addEventListener(type, (e) => release(e.pointerId));
canvas.addEventListener("contextmenu", (e) => e.preventDefault());

// Keyboard: hold Space or Enter
const holdKey = (e) => e.key === " " || e.key === "Enter";
addEventListener("keydown", (e) => {
  if (!holdKey(e) || e.target.closest?.("a, button")) return;
  e.preventDefault();
  const a = rand(0, TAU);
  if (!e.repeat) press("key", cx + Math.cos(a) * S * 0.36, cy + Math.sin(a) * S * 0.36);
});
addEventListener("keyup", (e) => { if (holdKey(e)) release("key"); });
addEventListener("blur", () => fingers.clear());

// --- End card ---

const endEl = $("end");
function showCard() {
  const best = parseInt(load(BEST_KEY), 10) || 0;
  if (!best || score < best) save(BEST_KEY, String(score));
  $("endTitle").textContent = `You grew a star in ${score}\u00a0second${score === 1 ? "" : "s"}`;
  $("best").textContent = !best ? "Your very first star." : score < best ? `New best! Previous best: ${best} seconds` : `Best: ${best} seconds`;
  endEl.hidden = false;
  cardAt = performance.now();
  $("card").focus({ preventScroll: true });
}

function reset() {
  mass = stage = runTime = endDelay = pulse = flash = bar = aside = 0;
  morph = 1;
  flashed = true;
  running = ended = false;
  for (const g of grains) g.on = false;
  free.splice(0, free.length, ...grains);
  for (const p of sparks) p.on = false;
  fingers.clear();
  showStage();
  endEl.hidden = true;
  document.activeElement?.blur();
}
// ignores a held key or a double tap landing on the new card
$("again").addEventListener("click", () => { if (performance.now() - cardAt > 500) reset(); });
$("cta").addEventListener("click", () => tell("cta"));

// --- Update ---

function update(dt) {
  time += dt;
  if (running && !ended) runTime += dt;
  const calm = reduced ? 0.4 : 1;
  spin += dt * 0.24 * calm;
  if (morph < 1) {
    morph = Math.min(1, morph + dt / MORPH);
    if (!flashed && morph > 0.42) { flashed = true; burst(); }
  }
  pulse *= Math.exp(-dt * 7);
  flash *= Math.exp(-dt * 3.2);

  for (const f of fingers.values()) {
    for (f.acc += dt * RATE; f.acc >= 1; f.acc--) spawn(f.x, f.y, 9);
  }
  for (const g of grains) if (g.on && (g.t += dt) >= g.d) absorb(g);
  const drag = Math.exp(-dt * 2.4);
  for (const p of sparks) {
    if (!p.on) continue;
    if ((p.life -= dt) <= 0) p.on = false;
    p.vx *= drag;
    p.vy *= drag;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
  for (const s of specks) s.a -= dt * s.sp * calm;
  for (const b of beads) b.a -= (dt * 0.45 * calm) / b.l;

  bar += (progress() - bar) * Math.min(1, dt * 8);
  if (Math.abs(bar - barSet) > 0.002) fillEl.style.transform = `scaleX(${(barSet = bar).toFixed(3)})`;
  if (endDelay > 0 && (endDelay -= dt) <= 0) showCard();
  // the object glides up (or left) to make room for the end card
  aside += ((endEl.hidden ? 0 : 1) - aside) * Math.min(1, dt * 3);
  cx = lerp(homeX, wide ? W * 0.27 : homeX, aside);
  cy = lerp(homeY, wide ? homeY : H * 0.3, aside);
}

// How full the current stage is, 0..1
function progress() {
  const next = STAGES[stage + 1];
  return next ? Math.min(1, (mass - STAGES[stage].at) / (next.at - STAGES[stage].at)) : 1;
}

// --- Draw ---

function glow(img, size, alpha) {
  if (alpha < 0.005) return;
  ctx.globalAlpha = Math.min(1, alpha);
  ctx.drawImage(img, cx - size, cy - size, size * 2, size * 2);
  ctx.globalAlpha = 1;
}

// Soft triangular rays around the star
function rays(R, w) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(time * (reduced ? 0.02 : 0.06));
  ctx.fillStyle = `rgba(255,214,140,${(0.08 * w).toFixed(3)})`;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * TAU, len = R * (i % 2 ? 1.9 : 2.5), r = R * 0.7;
    ctx.moveTo(Math.cos(a - 0.17) * r, Math.sin(a - 0.17) * r);
    ctx.lineTo(Math.cos(a) * len, Math.sin(a) * len);
    ctx.lineTo(Math.cos(a + 0.17) * r, Math.sin(a + 0.17) * r);
  }
  ctx.fill();
  ctx.restore();
}

// Gold ring: back half behind the ball, front half over it
function ring(R, w, back) {
  if (w < 0.01) return;
  const grow = 0.55 + 0.45 * w, rx = R * 1.85 * grow, ry = R * 0.5 * grow, a0 = back ? Math.PI : 0;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(-0.32);
  ctx.globalAlpha = w;
  ctx.strokeStyle = "rgba(246,200,110,0.7)";
  ctx.lineWidth = Math.max(1.2, R * 0.022);
  for (const l of [0.95, 1.06]) {
    ctx.beginPath();
    ctx.ellipse(0, 0, rx * l, ry * l, 0, a0, a0 + Math.PI);
    ctx.stroke();
  }
  ctx.fillStyle = "#ffd98a";
  ctx.beginPath();
  for (const b of beads) {
    const s = Math.sin(b.a), x = Math.cos(b.a) * rx * b.l, y = s * ry * b.l, r = (b.s * R) / 60;
    if ((s < 0) !== back) continue;
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, TAU);
  }
  ctx.fill();
  ctx.restore();
}

// Faceted ball: rotate, drop back faces, sort far to near, shade
function body(R, L, wCloud) {
  const ca = Math.cos(spin), sa = Math.sin(spin), ct = Math.cos(TILT), st = Math.sin(TILT);
  MESH.verts.forEach(([x0, y0, z0], i) => {
    const d = R * (1 + L.lump * MESH.lump[i] + L.jit * MESH.jit[i] + wCloud * 0.07 * Math.sin(time * 1.3 + i * 1.7));
    const x = x0 * ca + z0 * sa, z = z0 * ca - x0 * sa;
    PX[i] = x * d;
    PY[i] = (y0 * ct - z * st) * d;
    PZ[i] = (y0 * st + z * ct) * d;
  });
  order.length = 0;
  MESH.faces.forEach(([a, b, c], f) => {
    const ux = PX[b] - PX[a], uy = PY[b] - PY[a], uz = PZ[b] - PZ[a];
    const vx = PX[c] - PX[a], vy = PY[c] - PY[a], vz = PZ[c] - PZ[a];
    let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    const mz = PZ[a] + PZ[b] + PZ[c];
    if (nx * (PX[a] + PX[b] + PX[c]) + ny * (PY[a] + PY[b] + PY[c]) + nz * mz < 0) { nx = -nx; ny = -ny; nz = -nz; }
    if (nz <= 0) return;
    FL[f] = Math.max(0, (nx * LIGHT[0] + ny * LIGHT[1] + nz * LIGHT[2]) / Math.hypot(nx, ny, nz));
    FZ[f] = mz;
    order.push(f);
  });
  order.sort(byDepth);
  ctx.globalAlpha = L.alpha;
  ctx.lineJoin = "round";
  ctx.lineWidth = 0.8;
  for (const f of order) {
    const [a, b, c] = MESH.faces[f], col = L.cols[MESH.tone[f]];
    const lam = FL[f], lit = (L.amb + L.dif * lam) * MESH.vary[f], hi = Math.max(0, lam - 0.78) * 2.6 * L.spec;
    // shade from the stage's shadow colour towards the facet colour
    const rgb = col.map((v, j) => {
      const shade = L.sh[j] + (v - L.sh[j]) * lit;
      return Math.max(0, Math.min(255, shade + (255 - shade) * hi)) | 0;
    });
    ctx.fillStyle = ctx.strokeStyle = `rgb(${rgb})`;
    ctx.beginPath();
    ctx.moveTo(cx + PX[a], cy - PY[a]);
    ctx.lineTo(cx + PX[b], cy - PY[b]);
    ctx.lineTo(cx + PX[c], cy - PY[c]);
    ctx.closePath();
    ctx.fill();
    if (L.alpha > 0.98) ctx.stroke(); // hides the seams between solid facets
  }
  ctx.globalAlpha = 1;
}

const TRAIL_U = [0, 0.04, 0.09, 0.15], TRAIL_A = [0.5, 0.28, 0.12], TRAIL_W = [2.2, 1.6, 1.1];
const ease = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x));

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const tw = reduced ? 0.4 : 1;

  ctx.fillStyle = "#fff";
  for (let i = 0; i < starCount; i++) {
    const s = stars[i];
    ctx.globalAlpha = s.a * (0.55 + 0.45 * Math.sin(time * s.sp * tw + s.ph));
    ctx.fillRect(s.x * W, s.y * H, s.s, s.s);
  }
  ctx.globalAlpha = 1;

  // while morphing, blend the previous stage's look into the new one
  const from = morph < 1 ? stage - 1 : stage, k = morph < 1 ? ease((morph - 0.25) * 2) : 1;
  const A = LOOKS[from], B = LOOKS[stage], L = {};
  for (const key in B) L[key] = mix(A[key], B[key], k);
  const p = progress(), rTo = lerp(B.r0, B.r1, p), rFrom = from === stage ? rTo : A.r1;
  const swell = reduced || morph >= 1 ? 1 : 1 + 0.2 * Math.sin(Math.PI * Math.min(1, morph / 0.85));
  const R = (curR = lerp(rFrom, rTo, k) * S * swell * (1 + pulse));
  const weight = (i) => (i === from ? 1 - k : 0) + (i === stage ? k : 0);
  const wCloud = weight(0), wPlanet = weight(2), wStar = weight(3);

  ctx.globalCompositeOperation = "lighter";
  glow(GLOW, R * 2.8, 0.45 * wCloud);
  glow(GLOW, R * 2.1, 0.22 * (weight(1) + wPlanet));
  if (wStar > 0.01) {
    glow(WARM, R * (3.6 + 0.15 * Math.sin(time * 1.3 * tw)), 0.9 * wStar);
    rays(R, wStar);
  }
  ctx.globalCompositeOperation = "source-over";
  ring(R, wPlanet, true);
  body(R, L, wCloud);
  ring(R, wPlanet, false);

  ctx.globalCompositeOperation = "lighter";
  if (wCloud > 0.01) {
    const pull = (0.35 + 0.65 * wCloud) * (1 - 0.25 * (stage ? 1 : p));
    ctx.globalAlpha = 0.75 * wCloud;
    for (const s of specks) {
      const r = s.r * R * pull, z = s.s * 1.6;
      ctx.drawImage(DOTS[s.c], cx + Math.cos(s.a) * r - z, cy + Math.sin(s.a) * r * 0.72 - z, z * 2, z * 2);
    }
  }
  // grain trails, batched by colour and segment
  ctx.globalAlpha = 1;
  ctx.lineCap = "round";
  for (let c = 0; c < 3; c++) {
    for (let j = 0; j < 3; j++) {
      ctx.strokeStyle = `rgba(${GRAIN_RGB[c]},${TRAIL_A[j]})`;
      ctx.lineWidth = TRAIL_W[j];
      ctx.beginPath();
      for (const g of grains) {
        if (!g.on || g.c !== c) continue;
        const u = g.t / g.d;
        grainAt(g, Math.max(0, u - TRAIL_U[j]));
        ctx.moveTo(gx, gy);
        grainAt(g, Math.max(0, u - TRAIL_U[j + 1]));
        ctx.lineTo(gx, gy);
      }
      ctx.stroke();
    }
  }
  for (const g of grains) {
    if (!g.on) continue;
    const u = g.t / g.d, z = g.s * 2.2;
    grainAt(g, u);
    ctx.globalAlpha = Math.min(1, u * 10);
    ctx.drawImage(DOTS[g.c], gx - z, gy - z, z * 2, z * 2);
  }
  for (const q of sparks) {
    if (!q.on) continue;
    const a = q.life / q.max, z = q.s * (0.6 + 0.4 * a);
    ctx.globalAlpha = a;
    ctx.drawImage(DOTS[q.c], q.x - z, q.y - z, z * 2, z * 2);
  }
  ctx.globalAlpha = 1;
  glow(WHITE, Math.max(W, H) * 0.9, flash);
  ctx.globalCompositeOperation = "source-over";
}

// --- Loop: runs only while the page is visible ---

let raf = 0, last = 0;
function frame(now) {
  update(Math.min(0.05, Math.max(0, (now - last) / 1000)));
  last = now;
  draw();
  raf = requestAnimationFrame(frame);
}
function startLoop() {
  if (raf || document.hidden) return;
  last = performance.now();
  raf = requestAnimationFrame(frame);
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    cancelAnimationFrame(raf);
    raf = 0;
    fingers.clear();
    audioPause();
  } else {
    audioResume();
    startLoop();
  }
});
addEventListener("resize", resize);

resize();
showStage();
startLoop();
tell("ready");
</script>
</body>
</html>
